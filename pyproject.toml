[project]
name = "astromesh"
version = "0.1.0"
description = "Autonomous orbital debris mitigation simulation with live telemetry."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
]

[project.scripts]
astromesh = "astromesh.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"
